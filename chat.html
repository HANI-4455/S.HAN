<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의록 AI 챗봇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#15237A; --secondary:#2F497D; --accent:#F26300;
  --text:#272727; --bg:#F8F8F8; --card:#FFFFFF; --muted:#6B7280;
  --light:#E8ECF4; --line:#D1D8E8; --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;}

/* 헤더 */
header{background:#fff;border-bottom:1px solid #E0E4EE;padding:0 32px;display:flex;
  align-items:center;justify-content:space-between;height:64px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:34px;height:34px;background:var(--primary);border-radius:4px;display:flex;
  align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;letter-spacing:-1px;}
.brand-name{font-size:16px;font-weight:700;color:var(--primary);}
.brand-sub{font-size:11px;color:var(--muted);}
.header-right{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;}
a.back{font-size:12px;color:var(--secondary);text-decoration:none;font-weight:600;}
a.back:hover{text-decoration:underline;}

/* 히어로 */
.hero{background:var(--primary);padding:22px 32px;position:relative;overflow:hidden;flex-shrink:0;}
.hero-eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.hero-eyebrow .lo{width:22px;height:2px;background:var(--accent);}
.hero-eyebrow .lb{width:50px;height:1px;background:rgba(255,255,255,.3);}
.hero-eyebrow span{font-size:11px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:.12em;text-transform:uppercase;}
.hero h1{font-size:22px;font-weight:700;color:#fff;letter-spacing:-.5px;}
.hero p{margin-top:4px;font-size:13px;color:rgba(255,255,255,.6);font-weight:300;}

/* 설정 바 */
.setup{background:#FFF7ED;border-bottom:1px solid #FCD9B6;padding:14px 32px;font-size:13px;color:#9A3412;}
.setup.hidden{display:none;}
.setup .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;}
.setup input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:6px;padding:8px 12px;
  font-size:13px;font-family:inherit;outline:none;}
.setup input:focus{border-color:var(--primary);}
.setup button{padding:8px 16px;background:var(--primary);color:#fff;border:none;border-radius:6px;
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}

/* 채팅 영역 */
main{flex:1;overflow-y:auto;padding:24px 32px;}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
.msg{display:flex;gap:10px;max-width:88%;}
.msg .av{width:32px;height:32px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:700;}
.msg .bubble{padding:12px 16px;border-radius:10px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
.msg.bot{align-self:flex-start;}
.msg.bot .av{background:var(--primary);color:#fff;}
.msg.bot .bubble{background:#fff;border:1px solid var(--line);color:var(--text);}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg.user .av{background:var(--accent);color:#fff;}
.msg.user .bubble{background:var(--primary);color:#fff;}
.msg .bubble a{color:var(--accent);}
.empty{text-align:center;color:#B6BECB;padding:50px 0;}
.empty .ic{font-size:2.4rem;margin-bottom:10px;}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;}
.suggest button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 16px;
  font-size:13px;color:var(--secondary);font-family:inherit;cursor:pointer;}
.suggest button:hover{border-color:var(--primary);color:var(--primary);}
.typing{display:inline-flex;gap:4px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

/* 입력 바 */
.inputbar{background:#fff;border-top:1px solid #E0E4EE;padding:14px 32px;flex-shrink:0;}
.inputbar .box{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;}
.inputbar textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;
  font-family:inherit;outline:none;resize:none;max-height:140px;line-height:1.5;}
.inputbar textarea:focus{border-color:var(--primary);}
.inputbar button{padding:12px 22px;background:var(--accent);color:#fff;border:none;border-radius:10px;
  font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;}
.inputbar button:disabled{opacity:.5;cursor:not-allowed;}
.hint{max-width:820px;margin:8px auto 0;font-size:11px;color:var(--muted);text-align:center;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">PC</div>
    <div>
      <div class="brand-name">회의록 AI 챗봇</div>
      <div class="brand-sub">사업지원팀 · 회의록 기반 질의응답</div>
    </div>
  </div>
  <a class="back" href="index.html">← 허브로</a>
</header>

<div class="hero">
  <div class="hero-eyebrow"><div class="lo"></div><div class="lb"></div><span>AI Assistant</span></div>
  <h1>회의록에게 물어보세요</h1>
  <p>지금까지 저장된 회의록을 근거로 요약·검색·정리해 답합니다.</p>
</div>

<!-- 설정 (키/URL 없을 때만) -->
<div class="setup hidden" id="setup">
  <b>⚙️ 사용 전 설정이 필요합니다.</b> 아래 값을 입력하면 이 브라우저에 저장됩니다. (회의 녹음 도구와 공유됩니다)
  <div class="row">
    <input id="setKey" type="password" placeholder="Gemini API 키 (AIza...)">
    <input id="setUrl" type="text" placeholder="Apps Script 웹앱 URL (비워두면 기본값)">
    <button onclick="saveSetup()">저장</button>
  </div>
</div>

<main>
  <div class="wrap" id="chatWrap">
    <div class="empty" id="empty">
      <div class="ic">💬</div>
      <div>회의록에 대해 궁금한 걸 물어보세요.</div>
      <div class="suggest">
        <button onclick="ask(this.textContent)">가장 최근 회의 요약해줘</button>
        <button onclick="ask(this.textContent)">이번 달 결정사항 모아줘</button>
        <button onclick="ask(this.textContent)">미완료 액션 아이템 정리해줘</button>
      </div>
    </div>
  </div>
</main>

<div class="inputbar">
  <div class="box">
    <textarea id="input" rows="1" placeholder="메시지를 입력하세요…  (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
    <button id="sendBtn" onclick="ask()">전송</button>
  </div>
  <div class="hint">답변은 저장된 회의록을 근거로 AI가 생성합니다. 중요한 내용은 원본 회의록에서 다시 확인하세요.</div>
</div>

<script>
const el = id => document.getElementById(id);
const DEFAULT_SHEET_URL = "https://script.google.com/macros/s/AKfycbz7LDqYodP8Eka-Egond7q438y4HlgWfHPaq5mRHDaUNtM2-j42xGqG8Jc-4XrVWTGv5g/exec";
const GEMINI_MODEL = "gemini-2.5-flash";

function apiKey(){ return localStorage.getItem('mr_api_key') || ''; }
function sheetUrl(){ return localStorage.getItem('mr_sheet_url') || DEFAULT_SHEET_URL; }

let meetings = null;        // 캐시된 회의록 rows
let history = [];           // {role, text}
let busy = false;

function checkSetup(){
  if(!apiKey()){ el('setup').classList.remove('hidden'); el('setKey').value=''; el('setUrl').value=localStorage.getItem('mr_sheet_url')||''; return false; }
  el('setup').classList.add('hidden'); return true;
}
function saveSetup(){
  const k=el('setKey').value.trim(), u=el('setUrl').value.trim();
  if(!k){ alert('Gemini API 키를 입력하세요.'); return; }
  localStorage.setItem('mr_api_key', k);
  if(u) localStorage.setItem('mr_sheet_url', u);
  checkSetup();
}

/* 회의록 불러오기 (한 번만, 이후 캐시) */
async function loadMeetings(){
  if(meetings) return meetings;
  const res = await fetch(sheetUrl(), {method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'getMeetings'})});
  const txt = await res.text();
  let data;
  try{ data = JSON.parse(txt); }catch(_){ throw new Error('Apps Script 응답을 해석할 수 없습니다. 스크립트에 getMeetings 처리가 추가됐는지 확인하세요.'); }
  if(data.ok===false) throw new Error(data.error||'회의록을 불러오지 못했습니다.');
  if(!data.rows) throw new Error('Apps Script에 getMeetings 처리가 없습니다. (아래 안내대로 스크립트를 갱신하세요)');
  meetings = data.rows;
  return meetings;
}

/* rows → 프롬프트용 텍스트 (너무 크면 최근 것 우선) */
function buildContext(rows){
  const MAX=180000;
  const blocks = rows.map((r,i)=>{
    const g=k=>{ for(const kk in r){ if(kk.replace(/\s/g,'').includes(k)) return r[kk]; } return ''; };
    return `### 회의 ${i+1}\n`+
      `- 일시: ${g('일시')}\n- 제목: ${g('제목')||g('회의')}\n- 길이: ${g('길이')}\n`+
      `- 요약: ${g('요약')}\n- 논의주제: ${g('논의')}\n- 결정사항: ${g('결정')}\n`+
      `- 액션아이템: ${g('액션')}\n- 후속확인: ${g('후속')}\n- 메모: ${g('메모')}`;
  });
  let out=[], len=0;
  for(let i=blocks.length-1;i>=0;i--){ // 최근부터
    if(len+blocks[i].length>MAX) break;
    out.unshift(blocks[i]); len+=blocks[i].length;
  }
  return out.join('\n\n');
}

async function callGemini(question, context){
  const sys = `당신은 사업지원팀의 회의록 도우미입니다. 아래 [회의록 데이터]만을 근거로 한국어로 답하세요.\n`+
    `- 데이터에 없는 내용은 추측하지 말고 "회의록에 해당 내용이 없습니다"라고 답하세요.\n`+
    `- 날짜·담당자·기한 등은 정확히 인용하세요.\n- 표나 목록이 적절하면 활용해 간결하게 정리하세요.`;
  const convo = history.slice(-6).map(h=>`${h.role==='user'?'사용자':'도우미'}: ${h.text}`).join('\n');
  const prompt = `${sys}\n\n[회의록 데이터]\n${context||'(저장된 회의록이 없습니다)'}\n\n`+
    `[이전 대화]\n${convo||'(없음)'}\n\n[질문]\n${question}`;
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
    {method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey()},
     body:JSON.stringify({contents:[{parts:[{text:prompt}]}],
       generationConfig:{temperature:0.3,maxOutputTokens:4096,thinkingConfig:{thinkingBudget:0}}})});
  const raw = await res.text();
  if(!res.ok){
    let h=''; if(res.status===403)h=' — 키가 유효하지 않거나 권한이 없습니다.'; else if(res.status===429)h=' — 무료 한도를 초과했습니다.';
    throw new Error(`HTTP ${res.status}${h}\n${raw.slice(0,200)}`);
  }
  const data = JSON.parse(raw);
  const text = (((data.candidates||[])[0]||{}).content||{}).parts?.map(x=>x.text||'').join('')||'';
  if(!text) throw new Error('빈 응답입니다. 다시 시도해주세요.');
  return text;
}

function addMsg(role, text){
  el('empty')?.remove();
  const div=document.createElement('div'); div.className='msg '+role;
  div.innerHTML=`<div class="av">${role==='user'?'나':'AI'}</div><div class="bubble"></div>`;
  div.querySelector('.bubble').textContent=text;
  el('chatWrap').appendChild(div);
  document.querySelector('main').scrollTop=document.querySelector('main').scrollHeight;
  return div.querySelector('.bubble');
}

async function ask(preset){
  if(busy) return;
  if(!checkSetup()) { alert('먼저 Gemini API 키를 저장하세요.'); return; }
  const q = (preset || el('input').value).trim();
  if(!q) return;
  el('input').value=''; autosize();
  addMsg('user', q); history.push({role:'user',text:q});
  busy=true; el('sendBtn').disabled=true;
  const bubble = addMsg('bot',''); bubble.innerHTML='<span class="typing"><span></span><span></span><span></span></span>';
  try{
    const rows = await loadMeetings();
    const ctx = buildContext(rows);
    const ans = await callGemini(q, ctx);
    bubble.textContent = ans; history.push({role:'bot',text:ans});
  }catch(e){
    bubble.textContent = '⚠ ' + e.message;
  }finally{
    busy=false; el('sendBtn').disabled=false;
    document.querySelector('main').scrollTop=document.querySelector('main').scrollHeight;
  }
}

function autosize(){ const t=el('input'); t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,140)+'px'; }
el('input').addEventListener('input', autosize);
el('input').addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ask(); } });

checkSetup();
</script>
</body>
</html>
