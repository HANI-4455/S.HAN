<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조직도 관리 · 파리크라상</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--p:#15237A;--s:#2F497D;--a:#F26300;--t:#272727;--bg:#F5F6F8;--line:#D8DDE7;--mute:#737985;--tint:#EEF1F7;--bd:rgba(47,73,125,.35)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body:not(.admin) .admin-only{display:none!important}
#adminBox{font-size:13px;display:flex;align-items:center;gap:6px}
body{margin:0;font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--t);background:var(--bg);font-size:14px}
button,.btnlink{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--s);background:#fff;color:var(--s);border-radius:6px;padding:6px 12px;white-space:nowrap;text-decoration:none;display:inline-block}
button:hover,.btnlink:hover{background:var(--tint)}
button.pri{background:var(--p);border-color:var(--p);color:#fff}
button.pri:hover{background:var(--s)}
button.ghost{border-color:transparent;background:none}
button.ghost:hover{background:var(--tint)}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:4px;padding:5px 7px;color:var(--t);background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(21,35,122,.25);border-color:var(--p)}
label{font-size:13px;color:var(--t)}
.hint{font-size:12px;color:var(--mute);font-weight:300}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.sec{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600;color:var(--p);margin:0 0 10px}
.sec b{color:var(--a);font-size:17px}
.rule{display:flex;height:2px;margin:-4px 0 12px}.rule i{width:32px;background:var(--a)}.rule span{flex:1;background:var(--line)}

.app-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.app-head h1{font-size:18px;font-weight:600;color:var(--p);margin:0 10px 0 0}
.app-head .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#status{font-size:12px;color:var(--mute);margin-left:6px}
#status b{color:var(--p)}
.brand{margin-left:auto;font-weight:600;color:var(--p);letter-spacing:1px}
#banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:var(--tint);border-bottom:2px solid var(--p);color:var(--p);font-weight:600}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 100px)}
aside{background:#fff;border-right:1px solid var(--line);padding:16px}
.snap{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 10px;margin-bottom:6px;border:1px solid var(--line);border-radius:6px;color:var(--t);background:#fff;font-size:14px}
.snap.on{border-color:var(--p);background:var(--tint);color:var(--p);font-weight:600}
.snap small{font-size:12px;color:var(--mute);font-weight:400}
.snap.draft{border-style:dashed}
.who{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-top:6px;font-size:12px}
.who b{color:var(--p)}
.who div{padding:2px 0;color:var(--mute)}
.who div.ch{color:var(--t);font-weight:600}
main{padding:14px 20px 40px;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute);padding:8px 16px;font-size:14px}
.tabs button.on{color:var(--p);border-bottom-color:var(--p);font-weight:600}
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.warn{font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.warn:last-child{border:0}
.warn em{font-style:normal;font-weight:600;color:var(--p)}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 6px}
.notes textarea{width:100%;display:block;margin-top:4px;resize:vertical}
.tablewrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid th{background:var(--tint);color:var(--s);font-weight:600;text-align:left;padding:6px;border-bottom:1px solid var(--bd);white-space:nowrap}
table.grid td{padding:3px 4px;border-bottom:1px solid var(--line)}
table.grid td input,table.grid td select{width:100%}
table.grid tr.off td input{color:var(--mute)}
table.grid .ord button{padding:2px 6px;border:0;color:var(--mute)}
table.list{border-collapse:collapse;font-size:13px;width:100%}
table.list th,table.list td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
table.list th{color:var(--s);background:var(--tint)}
table.list td.num,table.list th.num{text-align:right}
.chg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.chg h3{font-size:14px;margin:0 0 6px;color:var(--p)}
.chg ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7}
.empty{padding:40px;text-align:center}
dialog{border:1px solid var(--s);border-radius:8px;padding:18px 20px;max-width:760px;width:92vw;color:var(--t)}
dialog::backdrop{background:rgba(21,35,122,.25)}
dialog h2{font-size:18px;color:var(--p);margin:0 0 10px}
dialog ol,dialog ul{padding-left:20px;line-height:1.75;font-size:14px;margin:6px 0 12px}
dialog h3{font-size:14px;color:var(--s);margin:14px 0 4px}

/* ===== 인쇄용 조직도 (A4 가로 1장) ===== */
.bar-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#sheetWrap{overflow:hidden}
#sheetScaler{transform-origin:0 0;width:max-content}
.sheet{width:280mm;height:178mm;background:#fff;position:relative;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.12)}
.oc{position:absolute;left:0;top:0;transform-origin:0 0;padding:14px 16px;width:max-content;font-size:12px;color:var(--t)}
.oc-head{display:flex;align-items:flex-end;gap:14px}
.oc-title{font-size:24px;font-weight:600;color:var(--p);white-space:nowrap}
.oc-date{font-size:12px;color:var(--mute);padding-bottom:4px;white-space:nowrap}
.oc-brand{margin-left:auto;font-size:13px;font-weight:600;color:var(--p);letter-spacing:1px;padding-bottom:4px}
.oc-rule{display:flex;height:2px;margin:6px 0 12px}.oc-rule i{width:56px;background:var(--a)}.oc-rule b{flex:1;background:var(--s)}
.oc-top{display:flex;gap:16px;align-items:flex-start;margin-bottom:12px}
.oc-exec{flex:1;display:flex;flex-direction:column;gap:6px;min-width:320px}
.oc-bar{padding:6px 12px;border-radius:4px;font-weight:600;text-align:center;font-size:14px;white-space:nowrap}
.oc-bar.l0{background:var(--p);color:#fff}
.oc-bar.l1{background:var(--s);color:#fff}
.oc-staff{border:1px solid var(--s);border-radius:4px;padding:5px 10px;font-size:12px;text-align:center}
.oc-staff small{color:var(--s);font-weight:600;margin-right:6px;font-size:11px}
.oc-staff span+span{margin-left:14px}
.oc-sum{border-collapse:collapse;font-size:11.5px;white-space:nowrap}
.oc-sum th,.oc-sum td{border:1px solid var(--bd);padding:3px 9px;text-align:center}
.oc-sum th{background:var(--s);color:#fff;font-weight:600;line-height:1.2}
.oc-sum th small{font-weight:300;font-size:9.5px}
.oc-sum td:first-child{text-align:left}
.oc-sum tr.tot td{font-weight:600;color:var(--p);background:var(--tint)}
.oc-sum tr.sub td{color:var(--mute)}
.oc-teams{display:flex;flex-direction:column;gap:8px}
.oc-trow{display:flex;gap:8px;align-items:stretch}
.oc-barrow{display:flex;flex-wrap:wrap;gap:6px}
.oc-barrow .oc-bar{flex:1 1 22%}
.oc-team{flex:1 1 auto;border:1px solid var(--s);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.oc-tn{background:var(--p);color:#fff;font-weight:600;text-align:center;padding:5px 6px;font-size:13px;white-space:nowrap}
.oc-tc{text-align:center;font-size:10.5px;padding:3px 4px;border-bottom:1px solid var(--bd);color:var(--s);white-space:nowrap}
.oc-lead{text-align:center;padding:4px;font-weight:600;color:var(--p);border-bottom:1px solid var(--bd);white-space:nowrap;font-size:12.5px}
.oc-lead small{font-weight:400;color:var(--mute);margin-right:4px;font-size:10.5px}
.oc-cols{display:flex;flex:1}
.oc-col{flex:1 1 0;min-width:88px;padding:2px 0 4px}
.oc-col+.oc-col{border-left:1px dashed var(--bd)}
.oc-h{background:var(--tint);color:var(--s);font-weight:600;text-align:center;font-size:10.5px;padding:2px 4px;margin:3px 5px 1px;border-radius:2px;white-space:nowrap}
.oc-n{text-align:center;padding:1px 4px;white-space:nowrap;line-height:1.4}
.oc-n small{color:var(--mute);font-size:10px}
.oc-bottom{display:flex;gap:8px;margin-top:10px}
.oc-box{flex:1 1 0;border:1px solid var(--s);border-radius:4px;padding:6px 10px;font-size:11px;line-height:1.55;white-space:pre-wrap;min-width:200px}
.oc-box h4{margin:0 0 2px;font-size:11.5px;color:var(--p)}

@page{size:A4 landscape;margin:8mm}
@media print{
  body{background:#fff}
  .app-head,#banner,aside,.tabs,.bar-tools,dialog{display:none!important}
  .app{display:block;min-height:0}
  main{padding:0}
  #sheetScaler{transform:none!important}
  #sheetWrap{height:auto!important}
  .sheet{box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.notes{grid-template-columns:1fr}}
</style>
</head>

<script>
'use strict';
const POS_RANK = {'본부장':0,'사업부장':0,'부사업부장':1,'실장':1,'부문장':1,'부실장':1,'팀장':2,'담당':3,'팀원':4};
const STATUS = ['재직','휴직'];

let D = {settings:{}, snapshots:[]}, cur = 'draft', tab = 'chart', ver = '', sheetUrl = '';
let dirty = false, saving = false, conflict = false, editSeq = 0, saveTimer = null, syncedAt = '', loadErr = '';
let token = '', adminName = '';
try { token = sessionStorage.getItem('orgToken') || ''; adminName = sessionStorage.getItem('orgAdmin') || ''; } catch (e) {}
const isAdmin = () => !!token;
let cmpId = '', fTeam = '', fText = '';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const dnum = s => Date.parse(s + 'T00:00:00');
const short = s => s ? s.slice(2).replace(/-/g, '.') : '';
const rank = p => POS_RANK[String(p).trim()] ?? 5;
const nowTime = () => new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});

/* ---------- 시트 연결 ---------- */
function call(fn, ...args) {
  return new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) return reject(new Error('구글 시트에 연결된 웹 앱 주소로 열어야 합니다.'));
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}
const draft = () => D.snapshots.find(s => s.draft);
const hist = () => D.snapshots.filter(s => !s.draft).sort((a, b) => b.date.localeCompare(a.date));
const S = () => D.snapshots.find(s => s.id === cur);
const prevOf = s => hist().find(x => x !== s && x.date < s.date);
function yearAgo(s) {
  const target = dnum(s.date) - 365 * 864e5;
  let best = null, gap = 46 * 864e5;
  hist().forEach(x => { const g = Math.abs(dnum(x.date) - target); if (x !== s && g < gap) { best = x; gap = g; } });
  return best;
}
const withId = p => ({id:uid(), team:p.team || '', position:p.position || '', role:p.role || '', name:p.name || '', status:p.status || '재직', note:p.note || ''});
function matchIds(people, base) {
  if (!base) return;
  const used = new Set();
  people.forEach(p => {
    const c = base.people.filter(q => q.name.trim() === p.name.trim() && !used.has(q.id));
    const m = c.find(q => q.team.trim() === p.team.trim()) || c[0];
    if (m) { p.id = m.id; used.add(m.id); }
  });
}
function fromServer(a) {
  const st = a.settings;
  D.settings = {orgName:st.orgName || 'PAS사업부', topUnit:st.topUnit || '사업부', coachRoles:st.coachRoles || '코칭매니저',
    maxRows:+st.maxRows || 15, showGroups:String(st.showGroups).toUpperCase() !== 'FALSE', owner:st.owner || ''};
  const info = k => a.infos[k] || {store:[], notes:{moves:'', leaves:''}, teamOrder:[]};
  let prev = null;
  const hs = Object.keys(a.hist).sort().map(d => {
    const s = Object.assign({id:'h:' + d, date:d, people:a.hist[d].map(withId), locked:true}, info(d));
    matchIds(s.people, prev); prev = s; return s;
  });
  const di = info('작성중');
  const dr = Object.assign({id:'draft', date:st.draftDate || today(), people:a.current.map(withId), draft:true}, di);
  matchIds(dr.people, hs.filter(s => s.date <= dr.date).pop() || hs[hs.length - 1]);
  D.snapshots = [dr, ...hs];
  ver = a.version; sheetUrl = a.sheetUrl; dirty = false; conflict = false; loadErr = '';
  if (!S()) cur = 'draft';
  if (!isAdmin() && cur === 'draft' && hs.length) cur = hs[hs.length - 1].id;   // 보기 전용: 최신 확정 기준일
}
async function load() {
  try { fromServer(await call('api_load')); syncedAt = nowTime(); }
  catch (e) { loadErr = e.message || String(e); }
  renderAll();
}
function touch() {
  if (!isAdmin()) return;
  dirty = true; editSeq++; renderStatus();
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 1500);
}
function payload() {
  const s = draft();
  return {people:s.people.map(p => ({team:p.team, position:p.position, role:p.role, name:p.name, status:p.status, note:p.note})),
    store:s.store, notes:s.notes, teamOrder:teams(s),
    settings:Object.assign({}, D.settings, {maxRows:String(D.settings.maxRows), showGroups:D.settings.showGroups ? 'TRUE' : 'FALSE', draftDate:s.date})};
}
async function save(force) {
  clearTimeout(saveTimer);
  if (saving) { saveTimer = setTimeout(save, 800); return; }
  if (!dirty && !force) return;
  saving = true; renderStatus();
  const seq = editSeq;
  try {
    const r = await call('api_saveDraft', token, payload(), ver, !!force);
    if (r.conflict) conflict = true;
    else {
      ver = r.version; conflict = false; syncedAt = nowTime();
      if (seq === editSeq) dirty = false; else saveTimer = setTimeout(save, 800);
    }
  } catch (e) { saving = false; if (!authFail(e)) alert('시트에 저장하지 못했습니다: ' + (e.message || e)); }
  saving = false; renderStatus();
}
async function checkRemote() {
  if (dirty || saving || conflict || !ver || document.hidden) return;
  try { const v = await call('api_version'); if (v !== ver && !dirty && !saving) await load(); } catch (e) {}
}
async function confirmDate() {
  const date = $('#cfDate').value, dr = draft();
  if (!dr) return;
  if (!date) return alert('확정할 기준일을 고르세요.');
  if (saving) return alert('시트에 저장 중입니다. 잠시 후 다시 눌러 주세요.');
  if (conflict) return alert('먼저 위 안내에서 시트 내용과 화면 내용 중 하나를 고르세요.');
  const w = warnings(dr), exists = hist().some(s => s.date === date);
  if (!confirm(`작성 중 명단 ${dr.people.length}명을 ${date} 기준일로 확정합니다.` +
    (exists ? `\n이미 있는 ${date} 명단은 새 명단으로 바뀝니다.` : '') +
    (w.length ? `\n아직 점검 항목 ${w.length}건이 남아 있습니다.` : ''))) return;
  clearTimeout(saveTimer); saving = true; dr.date = date; renderStatus();
  try {
    const r = await call('api_confirm', token, date, payload(), ver, false);
    saving = false;
    if (r.conflict) { conflict = true; return renderStatus(); }

function chartHtml(s) {

function fit() {
  const sheet = $('#sheet'), oc = $('#oc'); if (!sheet || !oc) return;
  const W = sheet.clientWidth, H = sheet.clientHeight, box = oc.querySelector('.oc-teams');
  const cards = oc._cards || (oc._cards = [...box.querySelectorAll('.oc-team')]);
  oc.style.transform = 'none';
  // 팀이 많으면 팀을 2~3줄로 나눠(줄마다 너비가 비슷하게) 글자가 가장 크게 나오는 배치를 고른다

    oc.style.width = 'max-content'; box.innerHTML = '';
    const one = document.createElement('div'); one.className = 'oc-trow'; cards.forEach(t => one.appendChild(t)); box.appendChild(one);
    if (lines > 1) {
      const w = cards.map(t => t.offsetWidth + 8), target = w.reduce((a, b) => a + b, 0) / lines;
      box.innerHTML = '';
      let idx = -1, acc = 0, rowEl = null;
      cards.forEach((t, i) => {
        if (idx < 0 || (acc + w[i] / 2 > target * (idx + 1) && idx < lines - 1)) { idx++; rowEl = document.createElement('div'); rowEl.className = 'oc-trow'; box.appendChild(rowEl); }

  let k = layout(best);
  if (W / oc.offsetWidth > k) { oc.style.width = (W / k) + 'px'; k = Math.min(k, H / oc.offsetHeight); }
  oc.style.transform = `scale(${k})`;
  const info = $('#scaleInfo');
  if (info) info.textContent = `A4 가로 1장에 맞춤 · 글자 배율 ${Math.round(k * 100)}%` + (k < 0.6 ? ' — 글자가 작습니다. 팀당 최대 줄 수를 늘려 보세요.' : '');

/* ---------- 변동 계산 ---------- */
function diff(a, b) {
  const A = new Map(a.people.map(p => [p.id, p])), B = new Set(b.people.map(p => p.id));
  const d = {join:[], out:[], move:[], pos:[], role:[], leave:[], back:[]};
  b.people.forEach(p => {
    const q = A.get(p.id);
    if (!q) return d.join.push(p);
    if (q.team.trim() !== p.team.trim()) d.move.push([q, p]);
    if (q.position.trim() !== p.position.trim()) d.pos.push([q, p]);
    if (q.role.trim() !== p.role.trim() && p.role.trim() !== '-' && q.role.trim() !== '-') d.role.push([q, p]);
    if (q.status === '재직' && p.status === '휴직') d.leave.push(p);
    if (q.status === '휴직' && p.status === '재직') d.back.push(p);
  });
  a.people.forEach(q => { if (!B.has(q.id)) d.out.push(q); });
  return d;
}
function autoNotes() {
  const s = draft(), pv = prevOf(s);

/* ---------- 점검 ---------- */

    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (m[i - 1] === n[j - 1] ? 0 : 1));

}
function warnings(s) {

  if (s.people.some(p => !p.name.trim())) w.push({msg:'이름이 비어 있는 행이 있습니다.'});
  const seen = {};
  s.people.forEach(p => { const k = p.team.trim() + '|' + p.name.trim(); seen[k] = (seen[k] || 0) + 1; });
  Object.entries(seen).forEach(([k, n]) => { if (n > 1 && k.split('|')[1]) { const [t, nm] = k.split('|'); w.push({msg:`<em>${esc(nm)}</em> — ${esc(t)}에 ${n}번 등록되어 인원이 중복 집계됩니다.`}); } });
  Object.keys(cnt).forEach(t => {
    if (!t || cnt[t] > 2) return;
    const u = Object.keys(cnt).find(x => x !== t && cnt[x] > 2 && lev(x, t) <= 2);
    if (u) w.push({msg:`팀명 <em>${esc(t)}</em>(${cnt[t]}명)은 <em>${esc(u)}</em>의 오타일 수 있습니다.`, from:t, to:u});
  });
  if (s.people.some(p => !p.team.trim())) w.push({msg:'팀명이 비어 있는 인원이 있습니다.'});
  teams(s).forEach(t => { if (!s.people.some(p => p.team.trim() === t && p.status === '재직' && isLead(p))) w.push({msg:`<em>${esc(t)}</em>에 재직 중인 팀장이 없습니다.`}); });
  s.people.forEach(p => {
    if (!STATUS.includes(p.status)) w.push({msg:`<em>${esc(p.name)}</em>의 상태가 '${esc(p.status)}'입니다. 재직·휴직만 집계됩니다.`});
    if (p.status !== '휴직') return;
    const ds = [...p.note.matchAll(/(\d{2,4})\.(\d{1,2})\.(\d{1,2})/g)];
    if (!ds.length) return;
    const [, y, mo, da] = ds[ds.length - 1], end = new Date(y.length === 2 ? 2000 + +y : +y, mo - 1, da);

  });
  return w;
}

  if (!isAdmin() && (tab === 'edit' || tab === 'set')) tab = 'chart';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const s = S(), pane = $('#pane');
  if (loadErr) {
    pane.innerHTML = `<div class="card empty"><div class="sec" style="justify-content:center"><b>!</b>시트에 연결하지 못했습니다</div>
      <p>${esc(loadErr)}</p><button class="pri" onclick="load()">다시 시도</button></div>`;
    return;
  }
  if (!s) { pane.innerHTML = '<div class="card empty">시트에서 불러오는 중…</div>'; return; }
  if (tab === 'chart') {
    pane.innerHTML = `<div class="bar-tools">
      <label><input type="checkbox" id="optGroups" ${D.settings.showGroups ? 'checked' : ''}> 직무별 소제목</label>
      <label>팀당 최대 줄 <input type="number" id="optRows" min="5" max="60" value="${+D.settings.maxRows || 15}" style="width:64px"></label>
      <span id="scaleInfo" class="hint"></span></div>
      <div id="sheetWrap"><div id="sheetScaler"><div class="sheet" id="sheet">${chartHtml(s)}</div></div></div>`;
    fit();
  } else if (tab === 'edit') {
    pane.innerHTML = s.locked ? paneLocked(s) : paneEdit(s);
    if (!s.locked) { renderRows(); renderWarn(); }
  } else if (tab === 'diff') pane.innerHTML = paneDiff(s);
  else { pane.innerHTML = paneSet(); loadUsers(); }
}

}

function renderWarn() {
  const w = warnings(draft());
  $('#warnBox').innerHTML = `<div class="sec"><b>!</b>점검 ${w.length ? w.length + '건' : '— 문제 없음'}</div>` +
    w.map(x => `<div class="warn"><span>${x.msg}</span>${x.from ? `<button data-from="${esc(x.from)}" data-to="${esc(x.to)}">‘${esc(x.to)}’로 바꾸기</button>` : ''}</div>`).join('');
}
function paneDiff(s) {
  const others = D.snapshots.filter(x => x.id !== s.id && (isAdmin() || !x.draft)).sort((a, b) => b.date.localeCompare(a.date));
  if (!others.length) return `<div class="card empty">비교할 다른 기준일이 없습니다.<br><span class="hint">작성 중 명단을 한 번 확정하면 그다음부터 변동 내역이 자동으로 계산됩니다.</span></div>`;
  const base = others.find(x => x.id === cmpId) || prevOf(s) || others[0];
  const [a, b] = base.date < s.date || (base.date === s.date && s.draft) ? [base, s] : [s, base];
  const d = diff(a, b), ca = counts(a), cb = counts(b);
  const lab = x => x.draft ? `작성 중(${x.date})` : x.date;
  const li = arr => arr.length ? `<ul>${arr.map(x => `<li>${x}</li>`).join('')}</ul>` : '<p class="hint">없음</p>';
  const tp = p => `${esc(p.name)} <span class="hint">${esc(p.team)}</span>`;
  const sec = [
    ['신규', d.join.map(tp)], ['제외 (퇴사·전출)', d.out.map(tp)],
    ['팀 이동', d.move.map(([q, p]) => `${esc(p.name)} : ${esc(q.team)} → ${esc(p.team)}`)],
    ['직책 변경', d.pos.map(([q, p]) => `${esc(p.name)} : ${esc(q.position)} → ${esc(p.position)}`)],
    ['직무 변경', d.role.map(([q, p]) => `${esc(p.name)} : ${esc(q.role)} → ${esc(p.role)}`)],
    ['휴직', d.leave.map(tp)], ['복직', d.back.map(tp)]];
  const tms = [...new Set([...teams(a), ...teams(b)])];
  const tr = (l, x, y) => `<tr><td>${l}</td><td class="num">${x}</td><td class="num">${y}</td><td class="num">${delta(y, x)}</td></tr>`;
  return `<div class="card"><div class="row"><div class="sec" style="margin:0"><b>01</b>변동 내역</div><span style="flex:1"></span>
      <label>비교 기준 <select id="cmpSel">${others.map(x => `<option value="${x.id}" ${x.id === base.id ? 'selected' : ''}>${esc(lab(x))}</option>`).join('')}</select></label></div>
    <div class="rule" style="margin-top:8px"><i></i><span></span></div>
    <p class="hint">${esc(lab(a))} → ${esc(lab(b))}</p>
    <div class="chg">${sec.map(([h, arr]) => `<div><h3>${h} ${arr.length}</h3>${li(arr)}</div>`).join('')}</div></div>
    <div class="card"><div class="sec"><b>02</b>인원 비교</div><div class="rule"><i></i><span></span></div>
    <table class="list"><tr><th>구분</th><th class="num">${esc(lab(a))}</th><th class="num">${esc(lab(b))}</th><th class="num">증감</th></tr>
    ${tr('부사업부장 이상', ca.exec, cb.exec)}${tr('팀장', ca.lead, cb.lead)}${tr('팀원(Staff)', ca.staff, cb.staff)}${tr('코칭매니저', ca.coach, cb.coach)}
    ${tr('<b>합계</b>', ca.total, cb.total)}${tr('휴직자', ca.leave, cb.leave)}
    ${tms.map(t => tr(esc(t) + ' <span class="hint">(팀장+팀원)</span>', ca.team[t] || 0, cb.team[t] || 0)).join('')}</table></div>`;
}

    <table class="list">${teams(s).map((t, i, arr) => `<tr data-team="${esc(t)}"><td>${i + 1}</td><td>${esc(t)}</td><td class="hint">${counts(s).team[t] || 0}명</td>
      <td style="text-align:right"><button data-tact="up" class="ghost" ${i ? '' : 'disabled'}>↑</button><button data-tact="dn" class="ghost" ${i < arr.length - 1 ? '' : 'disabled'}>↓</button><button data-tact="ren" class="ghost">팀명 변경</button></td></tr>`).join('')}</table></div>
    <div class="card"><div class="sec"><b>03</b>관리자 계정 <span class="hint">여기 등록된 사람만 명단 수정과 확정을 할 수 있습니다</span></div><div class="rule"><i></i><span></span></div>
    <div id="userList" class="hint">불러오는 중…</div>
    <div class="row" style="margin-top:10px"><input id="nuId" placeholder="아이디 (영문·숫자)" style="width:150px"><input id="nuName" placeholder="이름" style="width:110px">
      <input id="nuPw" type="password" placeholder="초기 비밀번호 8자 이상" style="width:180px"><button id="btnAddUser">관리자 추가</button></div>
    <div class="row"><input id="cpOld" type="password" placeholder="현재 비밀번호" style="width:150px"><input id="cpNew" type="password" placeholder="새 비밀번호 8자 이상" style="width:180px"><button id="btnChangePw">내 비밀번호 변경</button></div></div>`;
}
function renameTeam(from, to) {
  const s = draft();
  s.people.forEach(p => { if (p.team.trim() === from) p.team = to; });
  s.teamOrder = teams(s).map(t => t === from ? to : t).filter((t, i, a) => a.indexOf(t) === i);
  touch(); renderSide(); renderMain();
}

/* ---------- 이벤트 ---------- */
$('#btnReload').onclick = () => { if (dirty && !confirm('아직 시트에 저장되지 않은 변경이 있습니다. 시트 내용으로 새로고침할까요?')) return; clearTimeout(saveTimer); load(); };
$('#btnHelp').onclick = showHelp;
$('#adminBox').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'btnLogin') { $('#lgMsg').textContent = ''; $('#dlgLogin').showModal(); $('#lgId').focus(); }
  if (b.id === 'btnLogout') logout();
};
$('#lgGo').onclick = doLogin;
$('#lgPw').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
$('#btnConfirm').onclick = confirmDate;
$('#btnPrint').onclick = () => { if (!S()) return; tab = 'chart'; renderMain(); setTimeout(() => window.print(), 60); };
$('#banner').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'bnLoad' && confirm('화면에서 고친 내용은 사라지고 시트 내용을 불러옵니다. 계속할까요?')) { clearTimeout(saveTimer); dirty = false; conflict = false; load(); }
  if (b.id === 'bnForce' && confirm('시트에서 따로 바뀐 명단을 지금 화면 내용으로 덮어씁니다. 계속할까요?')) { dirty = true; save(true); }
};
$('#cfDate').onchange = e => { const dr = draft(); if (dr && e.target.value) { dr.date = e.target.value; touch(); renderSide(); if (cur === 'draft') renderMain(); } };
window.addEventListener('beforeprint', () => { if (S() && tab !== 'chart') { tab = 'chart'; renderMain(); } fit(); });
window.addEventListener('resize', fit);
window.addEventListener('focus', checkRemote);
window.addEventListener('beforeunload', e => { if (dirty || saving) { e.preventDefault(); e.returnValue = ''; } });
setInterval(checkRemote, 60000);

$('#tabs').onclick = e => { const t = e.target.closest('button'); if (t) { tab = t.dataset.t; renderMain(); } };
$('#snapList').onclick = e => { const b = e.target.closest('.snap'); if (b) { cur = b.dataset.id; cmpId = ''; renderSide(); renderMain(); } };
$('#who').oninput = renderWho;

const pane = $('#pane');
pane.addEventListener('input', e => {
  const t = e.target, s = draft(); if (!s) return;
  if (t.dataset.set) { D.settings[t.dataset.set] = t.value; return touch(); }
  if (t.id === 'fText') { fText = t.value; return renderRows(); }
  if (t.id === 'optRows') { D.settings.maxRows = +t.value || 15; touch(); return renderMain(); }
  if (S() !== s) return;
  if (t.dataset.f) {
    const p = s.people.find(x => x.id === t.closest('tr').dataset.id); p[t.dataset.f] = t.value;
    if (t.dataset.f === 'status') t.closest('tr').className = t.value !== '재직' ? 'off' : '';
    touch(); renderWarn(); renderSide(); return;
  }
  if (t.dataset.sf) { const x = s.store[+t.closest('[data-i]').dataset.i]; x[t.dataset.sf] = t.dataset.sf === 'n' ? t.value.replace(/\D/g, '') : t.value; return touch(); }
  if (t.id === 'nMoves') { s.notes.moves = t.value; return touch(); }
  if (t.id === 'nLeaves') { s.notes.leaves = t.value; return touch(); }
});
pane.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fTeam') { fTeam = t.value; renderRows(); }
  if (t.id === 'optGroups') { D.settings.showGroups = t.checked; touch(); renderMain(); }
  if (t.id === 'cmpSel') { cmpId = t.value; renderMain(); }
});
pane.addEventListener('click', e => {
  const b = e.target.closest('button'), s = draft(); if (!b || !s) return;
  if (b.id === 'btnDelSnap') return deleteDate(S());
  if (b.id === 'btnAddUser') return accountAction('api_addUser', [$('#nuId').value, $('#nuName').value, $('#nuPw').value], () => {
    $('#nuId').value = $('#nuName').value = $('#nuPw').value = '';
    alert('관리자를 추가했습니다. 아이디와 초기 비밀번호는 본인에게 따로 전달하고, 로그인 후 바꾸도록 안내하세요.');
  });
  if (b.dataset.deluser) { if (confirm(`${b.dataset.deluser} 관리자 계정을 삭제할까요?`)) accountAction('api_removeUser', [b.dataset.deluser]); return; }
  if (b.id === 'btnChangePw') return accountAction('api_changePassword', [$('#cpOld').value, $('#cpNew').value], () => {
    $('#cpOld').value = $('#cpNew').value = ''; alert('비밀번호를 바꿨습니다.');
  });
  const act = b.dataset.act;
  if (act) {
    const id = b.closest('tr').dataset.id, i = s.people.findIndex(p => p.id === id), p = s.people[i];
    if (act === 'del') { if (!confirm(`${p.name || '이 행'}을(를) 작성 중 명단에서 삭제할까요?`)) return; s.people.splice(i, 1); }
    else {
      const step = act === 'up' ? -1 : 1;
      let j = i + step; while (j >= 0 && j < s.people.length && s.people[j].team.trim() !== p.team.trim()) j += step;
      if (j < 0 || j >= s.people.length) return;
      [s.people[i], s.people[j]] = [s.people[j], s.people[i]];
    }
    touch(); renderRows(); renderWarn(); renderSide(); return;
  }
  if (b.id === 'btnAdd') {
    const p = {id:uid(), team:fTeam, position:'팀원', role:'', name:'', status:'재직', note:''};
    s.people.push(p); fText = ''; $('#fText').value = ''; touch(); renderRows(); renderWarn();
    const inp = $(`tr[data-id="${p.id}"] input[data-f="${fTeam ? 'name' : 'team'}"]`); inp.focus(); inp.scrollIntoView({block:'center'}); return;
  }
  if (b.id === 'btnAuto') return autoNotes();
  if (b.id === 'btnAddStore') { s.store.push({label:'', n:''}); touch(); return renderMain(); }
  if (b.dataset.sact === 'del') { s.store.splice(+b.closest('[data-i]').dataset.i, 1); touch(); return renderMain(); }
  if (b.dataset.from) return renameTeam(b.dataset.from, b.dataset.to);
  if (b.dataset.tact) {
    const t = b.closest('tr').dataset.team, order = teams(s), i = order.indexOf(t);
    if (b.dataset.tact === 'ren') { const n = prompt('새 팀명', t); if (n && n.trim() && n.trim() !== t) renameTeam(t, n.trim()); return; }
    const j = b.dataset.tact === 'up' ? i - 1 : i + 1;
    [order[i], order[j]] = [order[j], order[i]]; s.teamOrder = order; touch(); renderMain();
  }
});

document.body.classList.toggle('admin', isAdmin());
load();
if (document.fonts) document.fonts.ready.then(fit);
</script>
