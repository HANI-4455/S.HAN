name: 경쟁사 동향 수집

# 매일 오전 8시(KST) 자동 실행 + 저장소 Actions 탭에서 수동 실행 가능
on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = KST 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        working-directory: competitor_trend
        run: pip install -r requirements.txt

      - name: 데이터 수집
        working-directory: competitor_trend
        env:  # 저장소 Secrets 에 등록하면 네이버 Open API 로 수집, 없으면 검색 페이지 파싱
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python collect.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitor_trend/data/competitor_data.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "경쟁사 동향 데이터 자동 갱신"
            git push
          fi
